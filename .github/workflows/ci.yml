# AegisDeploy — continuous integration
# Every PR and push to main must pass. Jobs cover everything that exists
# today: backend libs + service template + catalog slice (python-quality),
# the catalog container (docker-build), Kubernetes manifests (k8s-lint),
# compose/YAML (yaml-and-compose) and docs.
#
# Component jobs land with their components:
#   frontend-build → enabled when frontend/ lands (P2, Dhanush)
#   ml / ai jobs   → added in P3 (detectors) and P4 (reasoning)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Validate YAML + compose config ────────────────────────────────────────
  yaml-and-compose:
    name: YAML & compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation deps
        run: pip install pyyaml

      - name: Validate YAML files
        run: python3 scripts/validate_yaml.py

      - name: Validate docker-compose config
        run: docker compose config --quiet

  # ── Lint Kubernetes manifests (K8s-ready posture, ADR-0005) ──────────────
  # Enforced since the walking skeleton (catalog-service base). Two checks:
  # kubeconform validates each manifest against the k8s schema; kustomize
  # build proves the kustomization assembles (and would fail on missing
  # referenced files).
  k8s-lint:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin kustomize

      - name: Schema-validate manifests (kubeconform)
        run: |
          # kustomization.yaml is not a k8s schema — validated by kustomize build below
          find infra/k8s -name '*.yaml' ! -name 'kustomization.yaml' -print0 \
            | xargs -0 -r kubeconform -strict -summary

      - name: Validate kustomize bases assemble
        run: kustomize build infra/k8s/base > /dev/null

  # ── Markdown & docs sanity ────────────────────────────────────────────────
  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check all markdown links resolve
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          bad = []
          for p in sorted(Path("docs").rglob("*.md")):
              for m in re.finditer(r"\]\(([^)]+)\)", p.read_text()):
                  t = m.group(1).split("#")[0].strip()
                  if not t or t.startswith(("http", "mailto")):
                      continue
                  if not (p.parent / t).resolve().exists():
                      bad.append(f"{p}: {t}")
          if bad:
              raise SystemExit("Broken docs links:\n" + "\n".join(bad))
          print("All docs links: OK")
          EOF

  # ── Python quality: lint · type check · tests ────────────────────────────
  # Covers the walking-skeleton packages. New backend packages are added to
  # this job (and to root pyproject testpaths) as they land in P2+.
  python-quality:
    name: Python quality (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages (editable, with dev extras)
        run: |
          pip install pyyaml \
                      -e backend/libs/telemetry[dev] \
                      -e backend/libs/eventbus[dev] \
                      -e backend/services/_template[dev] \
                      -e demoapp/aegisshop/catalog-service[dev]

      - name: Lint (ruff)
        run: ruff check backend demoapp

      - name: Type check (mypy --strict)
        run: >
          mypy backend/libs/telemetry backend/libs/eventbus
          backend/services/_template demoapp/aegisshop/catalog-service

      - name: Tests (pytest)
        run: >
          pytest backend/libs/telemetry backend/libs/eventbus
          backend/services/_template demoapp/aegisshop/catalog-service

      - name: Contract drift (surface check, edge case #8)
        run: python3 scripts/check_contract_drift.py

  # ── Container build (AegisShop + platform images as they land) ───────────
  # Currently the one real app image (catalog-service). Each new service
  # image joins this job in its PR (PR template checklist).
  docker-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build catalog-service image
        uses: docker/build-push-action@v6
        with:
          context: ./demoapp/aegisshop/catalog-service
          file: ./demoapp/aegisshop/catalog-service/Dockerfile
          tags: aegisshop/catalog-service:ci-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Frontend (placeholder — enabled when frontend/ lands, P2) ────────────
  frontend-build:
    name: Frontend (placeholder)
    runs-on: ubuntu-latest
    if: ${{ false }}   # enable when Dhanush lands the console scaffold (P2)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build console
        run: |
          cd frontend && npm ci && npm run build
