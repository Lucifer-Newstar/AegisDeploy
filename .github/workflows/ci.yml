# AegisDeploy — CI: what runs on every push/PR to main
#
# Six jobs, each one = ONE kind of check. All must pass before merge.
#
#   config-yaml-compose  → YAML files parse + docker-compose.yml is valid
#   k8s-manifests        → K8s manifests match real schemas + kustomize bases assemble
#   docs-links           → every link inside docs/** points to a real file
#   python-quality       → ruff (style) + mypy (types) + pytest (tests) + contract drift
#   docker-build         → the catalog-service container image actually builds
#   frontend-build       → disabled until the console lands (P2, Dhanush)
#
# New jobs are added when their component lands (ml in P3, ai in P4).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1 ── YAML files parse + compose config is valid ───────────────────────────
  config-yaml-compose:
    name: Config (YAML + compose)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validator
        run: pip install pyyaml

      - name: All *.yml/*.yaml parse cleanly
        run: python3 scripts/validate_yaml.py

      - name: docker-compose.yml is valid
        run: docker compose config --quiet

  # 2 ── K8s manifests are real (ADR-0005: compose ⇄ K8s parity) ─────────────
  k8s-manifests:
    name: K8s manifests (kubeconform + kustomize)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform (schema validator)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin kustomize

      - name: Validate manifests against k8s schemas
        run: |
          # kustomization.yaml is not a k8s schema — it is validated by `kustomize build` below
          find infra/k8s -name '*.yaml' ! -name 'kustomization.yaml' -print0 \
            | xargs -0 -r kubeconform -strict -summary

      - name: Kustomize bases assemble
        run: kustomize build infra/k8s/base > /dev/null

  # 3 ── Docs: every markdown link resolves ──────────────────────────────────
  docs-links:
    name: Docs (links resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: All docs/** links point at existing files
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path
          bad = []
          for p in sorted(Path("docs").rglob("*.md")):
              for m in re.finditer(r"\]\(([^)]+)\)", p.read_text()):
                  t = m.group(1).split("#")[0].strip()
                  if not t or t.startswith(("http", "mailto")):
                      continue
                  if not (p.parent / t).resolve().exists():
                      bad.append(f"{p}: {t}")
          if bad:
              raise SystemExit("Broken docs links:\n" + "\n".join(bad))
          print("All docs links: OK")
          EOF

  # 4 ── Backend: style, types, tests, and contract drift ────────────────────
  python-quality:
    name: Backend (ruff · mypy · pytest · contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages (editable, with dev extras)
        run: |
          pip install pyyaml \
                      -e backend/libs/telemetry[dev] \
                      -e backend/libs/eventbus[dev] \
                      -e backend/services/_template[dev] \
                      -e demoapp/aegisshop/catalog-service[dev]

      - name: Style (ruff)
        run: ruff check backend demoapp

      - name: Types (mypy --strict)
        run: >
          mypy backend/libs/telemetry backend/libs/eventbus
          backend/services/_template demoapp/aegisshop/catalog-service

      - name: Tests (pytest)
        run: >
          pytest backend/libs/telemetry backend/libs/eventbus
          backend/services/_template demoapp/aegisshop/catalog-service

      - name: Contract drift (docs/contracts vs live APIs)
        run: python3 scripts/check_contract_drift.py

  # 5 ── Containers: images actually build ───────────────────────────────────
  docker-build:
    name: Container (catalog-service image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the catalog-service image
        uses: docker/build-push-action@v6
        with:
          context: ./demoapp/aegisshop/catalog-service
          file: ./demoapp/aegisshop/catalog-service/Dockerfile
          tags: aegisshop/catalog-service:ci-${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 6 ── Frontend: enabled when the console lands (P2) ───────────────────────
  frontend-build:
    name: Frontend (starts in P2)
    runs-on: ubuntu-latest
    if: ${{ false }}   # remove `if` when Dhanush's console scaffold lands
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build console
        run: |
          cd frontend && npm ci && npm run build
