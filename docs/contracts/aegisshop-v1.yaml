# AegisShop v1 — demo workload API contract (catalog + cart + order + payment)
# Ports: catalog 9001 (LIVE) · cart 9002* · order 9003* · payment 9004* (*proposed)
# Version: 1.0.0 · Owner: Jegatheesan K (draft w/ Navin) · Freeze: 2026-09-08
#
# The demo application under monitoring. catalog-service already implements
# its part (walking skeleton) — this contract documents it as-is and defines
# the v1 shapes for cart/order/payment so the console mock server and the
# backend build against the same spec.
#
# Changelog:
#  1.0.0  initial contract (P2 kickoff)
openapi: 3.1.0
info:
  title: AegisShop v1 (demo workload)
  version: 1.0.0
  description: AegisShop microservices — catalog, cart, order, payment.
servers:
  - url: http://localhost:9001
    description: catalog-service (local compose)

paths:
  # ── Catalog (implemented — walking skeleton) ────────────────────────────
  /products:
    get:
      summary: List all products
      responses:
        "200":
          description: product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{product_id}:
    get:
      summary: Get one product
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            example: p-001
      responses:
        "200":
          description: product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: unknown product

  # ── Cart (new in P2) ─────────────────────────────────────────────────────
  /cart/{user_id}:
    get:
      summary: Get the user's cart
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            example: user-01
      responses:
        "200":
          description: cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/{user_id}/items:
    post:
      summary: Add an item to the cart
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          description: unknown product

  # ── Order (new in P2) ────────────────────────────────────────────────────
  /orders:
    post:
      summary: Place an order (checkout the cart)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                cart_id:
                  type: string
                  nullable: true
      responses:
        "201":
          description: order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: empty cart or unknown user

  /orders/{order_id}:
    get:
      summary: Get an order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: unknown order

  # ── Payment (new in P2) ──────────────────────────────────────────────────
  /payments:
    post:
      summary: Charge an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount]
              properties:
                order_id:
                  type: string
                amount:
                  type: number
                  exclusiveMinimum: 0
      responses:
        "201":
          description: payment processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "402":
          description: payment declined
        "404":
          description: unknown order

  /payments/{payment_id}:
    get:
      summary: Get a payment
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: unknown payment

components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          example: p-001
        name:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string

    CartItem:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          description: price snapshot at add-time (catalog can change later)

    Cart:
      type: object
      required: [user_id, items]
      properties:
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number

    Order:
      type: object
      required: [id, user_id, status, items, total]
      properties:
        id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [created, paid, shipped, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
        created_at:
          type: string
          format: date-time

    Payment:
      type: object
      required: [id, order_id, status, amount]
      properties:
        id:
          type: string
        order_id:
          type: string
        status:
          type: string
          enum: [succeeded, declined, refunded]
        amount:
          type: number
        paid_at:
          type: string
          format: date-time
          nullable: true
