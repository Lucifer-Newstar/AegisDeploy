# AegisDeploy — order-service contract (AegisShop v1)
# Port: 9003 (proposed — confirm at kickoff sync) · Version: 1.0.0 · Status: PENDING (P2, Jega)
#
# Changelog:
#  1.0.0  initial contract (P2 kickoff)
openapi: 3.1.0
info:
  title: AegisShop Order Service
  version: 1.0.0
  description: Order placement and tracking.
servers:
  - url: http://localhost:9003
    description: local compose

paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: process is up

  /ready:
    get:
      summary: Readiness probe (needs Postgres)
      responses:
        "200":
          description: ready
        "503":
          description: Postgres unreachable

  /orders:
    post:
      summary: Place an order (checkout the cart)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
                cart_id:
                  type: string
      responses:
        "201":
          description: order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: empty cart or unknown user

  /orders/{order_id}:
    get:
      summary: Get an order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: unknown order

components:
  schemas:
    CartItem:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number

    Order:
      type: object
      required: [id, user_id, status, items, total]
      properties:
        id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [created, paid, shipped, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
        created_at:
          type: string
          format: date-time
