# AegisDeploy — catalog-service contract (AegisShop v1)
# Port: 9001 · Version: 1.0.0 · Status: LIVE (walking skeleton slice) · Freeze: 2026-09-08
#
# Documented as-built from the walking skeleton. The contract-drift check
# (scripts/check_contract_drift.py) compares this file against the service's
# generated OpenAPI on every PR.
#
# Changelog:
#  1.0.0  initial contract (P2 kickoff)
openapi: 3.1.0
info:
  title: AegisShop Catalog Service
  version: 1.0.0
  description: Catalog of AegisShop products.
servers:
  - url: http://localhost:9001
    description: local compose

paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: process is up

  /ready:
    get:
      summary: Readiness probe (in-memory catalog — always ready in v1)
      responses:
        "200":
          description: ready

  /products:
    get:
      summary: List all products
      responses:
        "200":
          description: product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{product_id}:
    get:
      summary: Get one product
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
            example: p-001
      responses:
        "200":
          description: product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: unknown product

components:
  schemas:
    Product:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: string
          example: p-001
        name:
          type: string
        price:
          type: number
          exclusiveMinimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string
