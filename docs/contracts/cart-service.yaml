# AegisDeploy — cart-service contract (AegisShop v1)
# Port: 9002 (proposed — confirm at kickoff sync) · Version: 1.0.0 · Status: PENDING (P2, Jega)
#
# Changelog:
#  1.0.0  initial contract (P2 kickoff)
openapi: 3.1.0
info:
  title: AegisShop Cart Service
  version: 1.0.0
  description: Per-user shopping carts.
servers:
  - url: http://localhost:9002
    description: local compose

paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        "200":
          description: process is up

  /ready:
    get:
      summary: Readiness probe (needs Postgres)
      responses:
        "200":
          description: ready
        "503":
          description: Postgres unreachable

  /cart/{user_id}:
    get:
      summary: Get the user's cart
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            example: user-01
      responses:
        "200":
          description: cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/{user_id}/items:
    post:
      summary: Add an item to the cart
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "404":
          description: unknown product

components:
  schemas:
    CartItem:
      type: object
      required: [product_id, quantity, unit_price]
      properties:
        product_id:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price:
          type: number
          description: price snapshot at add-time (catalog can change later)

    Cart:
      type: object
      required: [user_id, items]
      properties:
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        total:
          type: number
