[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisshop-catalog-service"
version = "0.1.0"
description = "AegisShop catalog service (vertical slice — proves OTLP → Grafana flow)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["catalog_service*"]
