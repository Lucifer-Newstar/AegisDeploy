# order-service Kubernetes base (ADR-0005: 1:1 with the Compose service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: aegisshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: aegisshop
    spec:
      containers:
        - name: order-service
          image: aegisshop/order-service:0.1.0
          ports:
            - containerPort: 9003
              name: http
          env:
            - name: SERVICE_NAME
              value: order-service
            - name: SERVICE_PORT
              value: "9003"
            - name: ENVIRONMENT
              value: dev
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: CART_SERVICE_URL
              value: "http://cart-service:9002" 
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
