# AegisDeploy Kubernetes base (Kustomize)
# ADR-0005: every Compose service has a 1:1 Kustomize base here, using the same
# image tags, env names, and config mounts. Landed incrementally — this file is
# the anchor for CI linting (see .github/workflows/ci.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources: []
# resources will list manifests as components land, e.g.:
#   - postgres.yaml
#   - redis.yaml
#   - prometheus.yaml
#   - grafana.yaml
#   - loki.yaml
#   - tempo.yaml
#   - otel-collector.yaml
