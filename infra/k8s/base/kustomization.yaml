# AegisDeploy Kubernetes base (Kustomize)
# ADR-0005: every Compose service has a 1:1 Kustomize base here, using the same
# image tags, env names, and config mounts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - catalog-service-deployment.yaml
  - catalog-service-service.yaml
  - cart-service-deployment.yaml
  - cart-service-service.yaml
  - order-service-deployment.yaml
  - order-service-service.yaml
  - payment-service-deployment.yaml
  - payment-service-service.yaml
  - registry-service-deployment.yaml
  - registry-service-service.yaml
  - deployments-service-deployment.yaml
  - deployments-service-service.yaml
  - console-deployment.yaml
  - console-service.yaml
