# AegisDeploy Tempo configuration (single-binary, local dev)
# Docs: https://grafana.com/docs/tempo/latest/configuration/
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000

compactor:
  compaction:
    compaction_window: 1h
    max_compaction_objects: 1000000
    block_retention: 24h
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    block:
      bloom_filter_false_positive: 0.05
      # Tempo 2.6 removed `index_downsample_bytes`/`encoding` from the block
      # config (vParquet blocks dropped the index; encoding is now `version`).
      # Defaults (vParquet3) are fine for local dev — keep this minimal.
      version: vParquet3
