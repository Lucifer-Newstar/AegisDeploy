# AegisDeploy Prometheus configuration
# Mounted by both Docker Compose and Kubernetes (infra/k8s/base/prometheus).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aegisdeploy-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # AegisDeploy control-plane services (added as they come online; jobs are
  # additive so local Compose and K8s can share this file)
  - job_name: aegisdeploy-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    # NOTE: real targets are injected per-runtime (docker-compose DNS names in
    # Compose, service discovery in K8s). This entry is a placeholder; the
    # authoritative list is maintained per environment overlay.

  # AegisShop demo workload — the app under monitoring. First slice:
  # catalog-service (walking skeleton). Static target uses the service DNS
  # name, valid in Compose and Kubernetes alike (ADR-0005 posture).
  - job_name: aegisshop-catalog
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-service:9001"]
