# AegisDeploy Prometheus configuration
# Mounted by both Docker Compose and Kubernetes (infra/k8s/base/prometheus).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aegisdeploy-local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: aegisdeploy-registry
    metrics_path: /metrics
    static_configs:
      - targets: ["registry-service:8101"]

  - job_name: aegisdeploy-deployments
    metrics_path: /metrics
    static_configs:
      - targets: ["deployments-service:8701"]

  - job_name: aegisshop-catalog
    metrics_path: /metrics
    static_configs:
      - targets: ["catalog-service:9001"]

  - job_name: aegisshop-cart
    metrics_path: /metrics
    static_configs:
      - targets: ["cart-service:9002"]

  - job_name: aegisshop-order
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:9003"]

  - job_name: aegisshop-payment
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:9004"]
