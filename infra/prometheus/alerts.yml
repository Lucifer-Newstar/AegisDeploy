# AegisDeploy alerting rules — M1 baseline set.
# These rules become the *ground truth signals* that the anomaly pipeline and
# incident manager consume; keep them minimal and deterministic for now.
groups:
  - name: aegisdeploy-baseline
    interval: 30s
    rules:
      - alert: AegisDeployBackendDown
        expr: up{job="aegisdeploy-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AegisDeploy backend is unreachable"

      - alert: AegisDeployPrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
