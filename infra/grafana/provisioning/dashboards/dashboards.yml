# AegisSRE Grafana — no dashboard auto-provisioning in M1.
# Dashboards are added from M2 onward (as JSON in this directory).
apiVersion: 1
providers:
  - name: default
    orgId: 1
    folder: AegisSRE
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
